# Node 22 is required for --experimental-strip-types.
# The script suite, the app suite, and the backup drill each fail the job.
# Later steps still run so one suite cannot hide another. age is required
# to encrypt and restore the drill dump.

name: Test

on:
  pull_request:
  push:
    branches:
      - the-board

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avouch
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: avouch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avouch -d avouch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install age, psql, and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client ffmpeg

      - name: Template script tests
        id: scripts
        run: node scripts/run-tests.mjs scripts

      - name: App and server tests
        id: app
        if: always()
        run: node scripts/run-tests.mjs app

      - name: Backup restore drill
        id: backup
        if: always()
        env:
          CLEAR_POSTGRES_URL: postgres://avouch:secret@127.0.0.1:5432/avouch_test
          CLEAR_POSTGRES_REQUIRED: "1"
        run: node --test scripts/backup-restore.test.mjs scripts/backup-retention.test.mjs scripts/deploy-edge.test.mjs scripts/clear-email-limit.test.mjs scripts/seed-owner.test.mjs

      - name: Report suite results
        if: always()
        run: |
          echo "script tests: ${{ steps.scripts.outcome }}"
          echo "app tests: ${{ steps.app.outcome }}"
          echo "backup drill: ${{ steps.backup.outcome }}"
          if [ "${{ steps.scripts.outcome }}" != "success" ] || [ "${{ steps.app.outcome }}" != "success" ] || [ "${{ steps.backup.outcome }}" != "success" ]; then
            exit 1
          fi

  caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the pinned Caddy image
        run: docker build -f deploy/Dockerfile.caddy deploy

  media-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Process a picture and a video in the media profile
        run: chmod +x scripts/media-compose-smoke.sh && ./scripts/media-compose-smoke.sh

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the API image, migrate, and require /api/health
        run: chmod +x scripts/api-image-smoke.sh && ./scripts/api-image-smoke.sh

  failover-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install age and the Postgres client
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client

      - name: Dry-run restore into a throwaway Postgres
        run: chmod +x scripts/restore-from-backup.sh scripts/restore-postgres.sh scripts/failover-restore-drill.sh && ./scripts/failover-restore-drill.sh

  frontend-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the static frontend with auth on
        run: npm run build:frontend
        env:
          VITE_AUTH_ENABLED: "true"

      - name: Fail if the built bundle has auth disabled
        run: node scripts/check-frontend-auth.mjs
