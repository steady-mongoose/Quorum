# Node 22 is required for --experimental-strip-types.
# The template script suite stays continue-on-error so a missing .grok
# checkout cannot skip the app tests. The backup drill is its own step
# and does fail the job. age is required to encrypt and restore the drill dump.

name: Test

on:
  pull_request:
  push:
    branches:
      - the-board

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Template script tests
        id: scripts
        continue-on-error: true
        run: node scripts/run-tests.mjs scripts

      - name: App and server tests
        id: app
        if: always()
        run: node scripts/run-tests.mjs app

      - name: Backup restore drill
        id: backup
        if: always()
        run: node --test scripts/backup-restore.test.mjs scripts/backup-retention.test.mjs scripts/deploy-edge.test.mjs scripts/clear-email-limit.test.mjs

      - name: Report suite results
        if: always()
        run: |
          echo "script tests: ${{ steps.scripts.outcome }}"
          echo "app tests: ${{ steps.app.outcome }}"
          echo "backup drill: ${{ steps.backup.outcome }}"
          echo "The template script suite already fails on the base branch when .grok is absent. It no longer skips the app suite."
          if [ "${{ steps.app.outcome }}" != "success" ] || [ "${{ steps.backup.outcome }}" != "success" ]; then
            exit 1
          fi

  caddy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the pinned Caddy image
        run: docker build -f deploy/Dockerfile.caddy deploy
