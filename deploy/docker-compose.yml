# API for api.avouchsocial.com. Postgres is not published to the host.
# `docker compose up -d` does not migrate. See README.md before the migrate profile.

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avouch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-avouch}
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # TCP, not the socket. The image's init server listens only on the socket, so a
    # socket check can look healthy before Postgres is actually up.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-avouch} -d ${POSTGRES_DB:-avouch}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - avouch

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    # CALLS stays off until CALLS=on is set in deploy/.env. docker compose up
    # does not start the calls profile. Room calls live in this one process.
    # Do not run a second api replica.
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-avouch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avouch}
      PORT: "8787"
      CSAM_HOLD_KEY: ${CSAM_HOLD_KEY:-}
      CSAM_HOLD_DAYS: ${CSAM_HOLD_DAYS:-365}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      RESEND_FROM: ${RESEND_FROM:-}
      # Caddy's address on the avouch network. X-Forwarded-For is read only from this peer.
      # The request URL is BETTER_AUTH_URL.
      TRUSTED_PROXIES: 172.28.19.10
      ENV_FILE: /app/deploy/.env
    volumes:
      - ./.env:/app/deploy/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - avouch

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      API_HOST: ${API_HOST:-api.avouchsocial.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      avouch:
        ipv4_address: 172.28.19.10

  # Not started by `docker compose up`. Run only after the owner approves the SQL
  # in migrations/0004_media.sql and migrations/0007_media_worker_role.sql:
  #   docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile media up -d
  # ffmpeg runs in media-sandbox, which has no network. unshare is not used:
  # Docker's default seccomp profile blocks it once SYS_ADMIN is dropped.
  # The worker claims one job and waits until that job finishes. pids_limit
  # is per user, so it only holds while one job runs at a time.
  # Root prepares the volumes, then exits. It has no network and a read-only
  # root, and the only capabilities it keeps are CHOWN and FOWNER. The sandbox
  # and the worker drop every capability, so they cannot chown a new volume.
  media-init:
    profiles: ["media"]
    image: node:22-bookworm-slim
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p /jobs/samples /control && chown 1000:1000 /jobs /jobs/samples /control && chmod 755 /jobs /jobs/samples /control"
    volumes:
      - media-jobs:/jobs
      - media-control:/control
    restart: "no"

  media-sandbox:
    profiles: ["media"]
    user: "node"
    init: true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: media
    network_mode: none
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME: /tmp
      TMPDIR: /tmp
      MEDIA_JOBS_DIR: /jobs
    command: ["node", "--experimental-strip-types", "server/media-sandbox.ts"]
    volumes:
      - media-jobs:/jobs
    depends_on:
      media-init:
        condition: service_completed_successfully
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "test", "-f", "/jobs/sandbox-ready"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 15s

  # The only path off media-egress. It dials the storage host and nothing else.
  media-proxy:
    profiles: ["media"]
    user: "node"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MEDIA_S3_HOST: ${MEDIA_S3_HOST:-storage.invalid}
      MEDIA_S3_PORT: ${MEDIA_S3_PORT:-443}
    command: ["node", "--experimental-strip-types", "server/media-egress.ts"]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
    networks:
      media-egress:
        ipv4_address: 172.28.20.10
      storage-egress:

  # Echo server for the compose smoke test. Production does not start this profile.
  storage-sink:
    profiles: ["media-test"]
    image: node:22-bookworm-slim
    command:
      [
        "node",
        "-e",
        "require('net').createServer((s)=>{s.on('data',(c)=>{if(String(c).includes('ping'))s.end('pong')})}).listen(9000,'0.0.0.0')",
      ]
    networks:
      - storage-egress

  media-worker:
    profiles: ["media"]
    user: "node"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME: /tmp
      TMPDIR: /tmp
      DATABASE_URL: postgres://media_worker:${MEDIA_WORKER_DB_PASSWORD:-}@/${POSTGRES_DB:-avouch}?host=/var/run/postgresql
      PGHOST: /var/run/postgresql
      MEDIA_JOBS_DIR: /jobs
      MEDIA_CONTROL_DIR: /control
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-true}
      MEDIA_VIDEO: ${MEDIA_VIDEO:-}
    extra_hosts:
      - "${MEDIA_S3_HOST:-storage.invalid}:172.28.20.10"
    command: ["node", "--experimental-strip-types", "server/media-worker.ts"]
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    volumes:
      - pgsocket:/var/run/postgresql
      - media-jobs:/jobs
      - media-control:/control
    depends_on:
      media-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      media-sandbox:
        condition: service_healthy
      media-proxy:
        condition: service_started
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - media-egress
    healthcheck:
      test: ["CMD", "test", "-f", "/control/worker-ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Not started by `docker compose up`. Run only after the owner approves the SQL:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-avouch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-avouch}
      MEDIA_WORKER_DB_PASSWORD: ${MEDIA_WORKER_DB_PASSWORD:-}
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - avouch

  # Not started by `docker compose up`. Room calls stay off until CALLS=on
  # in deploy/.env and this profile is started on purpose:
  #   docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile calls up -d coturn
  # LiveKit is not here. A media server can record, and these calls are not recorded.
  # Coturn only forwards packets between the browsers. It has no recording switch.
  coturn:
    profiles: ["calls"]
    image: coturn/coturn:4.6.3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    restart: unless-stopped
    network_mode: host
    environment:
      CALLS_TURN_SECRET: ${CALLS_TURN_SECRET:-}
      CALLS_TURN_REALM: ${CALLS_TURN_REALM:-avouchsocial.com}
      CALLS_TURN_EXTERNAL_IP: ${CALLS_TURN_EXTERNAL_IP:-}
    entrypoint: ["/bin/sh", "/coturn.sh"]
    volumes:
      - ./coturn.sh:/coturn.sh:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  avouch:
    ipam:
      config:
        - subnet: 172.28.19.0/24
  # No default route. The worker reaches storage only through media-proxy.
  media-egress:
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
  # The proxy's path to the storage host. Postgres, Caddy, and the API are not attached.
  storage-egress:

volumes:
  pgdata:
  pgsocket:
  media-jobs:
  media-control:
  caddy-data:
  caddy-config:
